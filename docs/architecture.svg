<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5f7a8a"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="#f7fbfc"/>
  <text x="460" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1b4a55">IoT 智联专家 — 设备接入与数据质量全链路</text>
  <text x="460" y="66" text-anchor="middle" font-size="13" fill="#5f7a8a">IoT SmartLink Experts · Device Onboarding → Platform → Data Quality</text>

  <!-- Layer boxes -->
  <g>
    <rect x="30" y="110" width="160" height="250" rx="12" fill="#e3f2f5" stroke="#7fb6c4"/>
    <text x="110" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1b4a55">设备层</text>
    <g font-size="12" fill="#2c6273">
      <rect x="45" y="155" width="130" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="110" y="176" text-anchor="middle">温湿度传感器</text>
      <rect x="45" y="197" width="130" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="110" y="218" text-anchor="middle">PLC / 工业仪表</text>
      <rect x="45" y="239" width="130" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="110" y="260" text-anchor="middle">智能表计</text>
      <rect x="45" y="281" width="130" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="110" y="302" text-anchor="middle">视频 / 执行器</text>
    </g>
  </g>

  <g>
    <rect x="240" y="110" width="180" height="250" rx="12" fill="#e3f2f5" stroke="#7fb6c4"/>
    <text x="330" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1b4a55">接入层 · 葛连通</text>
    <g font-size="12" fill="#2c6273">
      <rect x="252" y="155" width="156" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="330" y="176" text-anchor="middle">MQTT / CoAP 直连</text>
      <rect x="252" y="197" width="156" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="330" y="218" text-anchor="middle">Modbus → 网关转换</text>
      <rect x="252" y="239" width="156" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="330" y="260" text-anchor="middle">NB-IoT / LoRaWAN</text>
      <rect x="252" y="281" width="156" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="330" y="302" text-anchor="middle">物模型 · 鉴权 · OTA</text>
    </g>
  </g>

  <g>
    <rect x="470" y="110" width="180" height="250" rx="12" fill="#e3f2f5" stroke="#7fb6c4"/>
    <text x="560" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1b4a55">平台层</text>
    <g font-size="12" fill="#2c6273">
      <rect x="482" y="155" width="156" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="560" y="176" text-anchor="middle">设备管理 / 影子</text>
      <rect x="482" y="197" width="156" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="560" y="218" text-anchor="middle">规则引擎 / 转发</text>
      <rect x="482" y="239" width="156" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="560" y="260" text-anchor="middle">时序存储</text>
      <rect x="482" y="281" width="156" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="560" y="302" text-anchor="middle">命令下发 / OTA</text>
    </g>
  </g>

  <g>
    <rect x="700" y="110" width="190" height="250" rx="12" fill="#e3f2f5" stroke="#7fb6c4"/>
    <text x="795" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1b4a55">数据质量 · 甄明晰</text>
    <g font-size="12" fill="#2c6273">
      <rect x="712" y="155" width="166" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="795" y="176" text-anchor="middle">完整性 · 完整率</text>
      <rect x="712" y="197" width="166" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="795" y="218" text-anchor="middle">时效性 · 及时率</text>
      <rect x="712" y="239" width="166" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="795" y="260" text-anchor="middle">准确性 · 异常检测</text>
      <rect x="712" y="281" width="166" height="34" rx="6" fill="#ffffff" stroke="#a9cdd8"/><text x="795" y="302" text-anchor="middle">一致性 · 清洗治理</text>
    </g>
  </g>

  <!-- Arrows -->
  <g stroke="#5f7a8a" stroke-width="2" marker-end="url(#arrow)">
    <line x1="192" y1="235" x2="236" y2="235"/>
    <line x1="422" y1="235" x2="466" y2="235"/>
    <line x1="652" y1="235" x2="696" y2="235"/>
  </g>

  <!-- Lead bar -->
  <rect x="160" y="392" width="600" height="44" rx="10" fill="#1b4a55"/>
  <text x="460" y="420" text-anchor="middle" font-size="14" fill="#ffffff">🧭 主理人 · 端木联：需求澄清 → 任务编排 → 平台选型 / 架构 / 成本 → 方案汇编</text>
</svg>
